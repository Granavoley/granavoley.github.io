<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granavoley · Partidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: club matchday board — direct, sporty, readable at the pavilion door
   IDEA: the printed fixture sheet pinned on the club noticeboard
   PICTURE: this week's matches of every Granavoley team as large hanging-time cards
   COLOUR and TYPE: granate field, gold accent, black ink; Barlow Condensed headings, Barlow body
   LAYOUT: granate header band with team switcher, then notices, week board, per-team rounds + table + rival */
:root{color-scheme:light dark;
--bg:light-dark(#f7f3ef,#120a0c);--card:light-dark(#fff,#1d1114);--ink:light-dark(#170c0f,#f3e9e4);
--mute:light-dark(#6d5a5e,#b59ea3);--line:light-dark(#e6dad5,#3a2328);
--gr:#561a2b;--gr2:light-dark(#461825,#2a0910);--gold:#d4a72c;--goldInk:light-dark(#8a6a10,#e6c25a);
--gvInk:light-dark(#561a2b,#ff9fb0);--mineBg:light-dark(#fbf1dc,#2b1d0d);
--win:light-dark(#1f7a3f,#5ccf86);--loss:light-dark(#b4233a,#ff7a8c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
a{color:inherit}
.band{padding:clamp(20px,3.5vw,44px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:linear-gradient(160deg,var(--gr) 0%,#36101b 100%);color:#fff;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:22px solid rgba(212,167,44,.18)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.logo{width:68px;height:68px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
h1{font-size:clamp(32px,5vw,50px);line-height:1.02;margin:0;font-weight:800}
.sub{color:#f1d9a0;margin:4px 0 0;font-size:15px}
.upd{margin-left:auto;font-size:13px;color:#e9cfd4;text-align:right}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tag{display:inline-block;font:600 12px Barlow,sans-serif;padding:2px 8px;border-radius:6px;background:var(--gold);color:#1a0d00;vertical-align:middle;margin-left:6px}
h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 4px;line-height:1.05}
.lead{color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;position:relative}
.m .when{grid-row:span 4;text-align:center;border-right:2px solid var(--gold);padding-right:14px;min-width:64px}
.m .d{font:700 28px/1 "Barlow Condensed",sans-serif}.m .mo{font-size:13px;color:var(--mute);text-transform:capitalize}
.m .t{font:700 15px "Barlow Condensed",sans-serif;color:var(--goldInk);white-space:nowrap}
.m .comp{font-size:13px;color:var(--mute);font-weight:600;padding-right:70px}
.m .vs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.m .vs span{font-weight:500;overflow-wrap:anywhere}.m .vs b{font:700 20px "Barlow Condensed",sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.gv{color:var(--gvInk);font-weight:700!important}
.venue{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:flex-start}
.venue a{color:var(--goldInk);font-weight:600;text-decoration:none;white-space:nowrap}.venue a:hover{text-decoration:underline}
.sets{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:10px;right:12px;font:700 12px Barlow,sans-serif;padding:2px 8px;border-radius:999px;color:#fff}
.badge.w{background:var(--win)}.badge.l{background:var(--loss)}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
select{font:500 16px Barlow,sans-serif;padding:9px 12px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn{font:600 15px Barlow,sans-serif;min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn[aria-pressed=true]{border-color:var(--gr);background:var(--gr);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.round{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.round h3{margin:0;padding:12px 16px;font-size:22px;background:var(--gr2);color:#fff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.round h3 small{font:500 14px Barlow,sans-serif;color:#f1d9a0}
.row{display:grid;grid-template-columns:86px minmax(0,1fr) 54px minmax(0,1fr);gap:4px 8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.row .dt{font-size:13px;color:var(--mute);line-height:1.25;white-space:nowrap}
.row .h{text-align:right}.row .res{font:700 19px "Barlow Condensed",sans-serif;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.mine{background:var(--mineBg)}
.row .lc{grid-column:2/-1;justify-content:center;text-align:center}
.row .sets{grid-column:2/-1;text-align:center}
@media(max-width:520px){.row{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr)}.row .dt{grid-column:1/-1;white-space:normal}.row .lc,.row .sets{grid-column:1/-1}}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font:600 13px Barlow,sans-serif;color:var(--mute);background:light-dark(#f2ebe6,#24161a)}
td.n,th.n{text-align:left;white-space:normal}td.p{font-weight:700;width:2.5em}
tr.mine td{background:var(--mineBg);font-weight:700}tr.riv td{box-shadow:inset 0 -2px 0 var(--gold)}
.scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.kpi b{display:block;font:700 26px/1.1 "Barlow Condensed",sans-serif}.kpi span{font-size:13px;color:var(--mute)}
.form{display:flex;gap:4px}.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px Barlow;color:#fff;font-style:normal}
.empty{padding:22px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 8px;font-size:24px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.rv dt{color:var(--mute)}.rv dd{margin:0;font-weight:600}
.aviso{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;background:#111;color:#fff;border-radius:16px;padding:18px 20px;border:2px solid var(--gold)}
.aviso .ball{width:58px;height:58px}
.aviso h3{margin:0;font-size:clamp(22px,3vw,30px);color:var(--gold)}
.aviso p{margin:2px 0 0;color:#eee}.aviso .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.aviso .meta span{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;font-size:14px}
@media(max-width:520px){.aviso{grid-template-columns:1fr}.aviso .ball{display:none}}
.wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.wk h3{margin:0;font-size:clamp(22px,3vw,30px);min-width:12ch}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .tm{font:700 20px/1.05 "Barlow Condensed",sans-serif;color:var(--goldInk)}.li .tm small{display:block;font:600 12.5px Barlow,sans-serif;color:var(--mute);text-transform:capitalize}
.li .tt{font-weight:600}.li .tt span{color:var(--mute);font-weight:500}
.li .rs{font:700 20px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .rs.w{color:var(--win)}.li .rs.l{color:var(--loss)}
.li .venue{grid-column:2/-1}
@media(max-width:520px){.li{grid-template-columns:70px minmax(0,1fr)}.li .rs{grid-column:2}}
.vgroup{margin-bottom:22px}.vgroup h3{font-size:24px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.vgroup h3 small{font:500 14px Barlow,sans-serif;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 22px}
.stat{background:var(--gr);color:#fff;border-radius:14px;padding:14px 16px}.stat b{display:block;font:800 clamp(30px,4vw,42px)/1 "Barlow Condensed",sans-serif;color:var(--gold)}.stat span{font-size:14px;color:#f3dfe3}
.bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bar-row:first-child{border-top:0}
.bar-row .nm{font-weight:600}.bar-row .nm small{display:block;color:var(--mute);font-weight:500;font-size:12.5px}
.track{height:14px;background:light-dark(#efe6e1,#2a1a1e);border-radius:999px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),#7a2a40);border-radius:999px}
.bar-row .vv{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}.bar-row .vv b{font:700 18px "Barlow Condensed",sans-serif}
@media(max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr) auto}.bar-row .track{grid-column:1/-1;grid-row:2}}
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){.shop{grid-template-columns:minmax(0,1fr)}}
.prod-img{background:radial-gradient(90% 80% at 50% 35%,#6a2236 0%,#461825 60%,#2a0912 100%);border-radius:18px;aspect-ratio:1;display:grid;place-items:center;border:3px solid var(--gold)}
.prod-img svg{width:86%;height:86%}
.prod h3{font-size:clamp(28px,4vw,40px);margin:0}
.price{font:800 34px "Barlow Condensed",sans-serif;color:var(--gvInk);margin:6px 0 10px}
.price.tbd{font-size:20px;color:var(--mute)}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.sizes button{min-width:52px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer}
.sizes button[aria-pressed=true]{background:#111;color:var(--gold);border-color:#111}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.qty button{width:44px;height:44px;border:0;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}.qty output{min-width:40px;text-align:center;font-weight:700}
.field{display:grid;gap:4px;margin:12px 0}.field label{font-weight:600;font-size:14px}
.field input{font:16px Barlow,sans-serif;padding:10px 12px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;background:#1f9d55;color:#fff;font:700 17px Barlow,sans-serif;text-decoration:none;border:0;cursor:pointer}
.cta[aria-disabled=true]{background:var(--mute);cursor:not-allowed}
.infob{display:grid;gap:6px;margin-top:16px;font-size:15px}.infob div{display:flex;gap:8px}.infob dt{color:var(--mute);min-width:9em}
.club-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.note{font-size:13px;color:var(--mute)}
footer{color:var(--mute);font-size:13px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1520px;margin:0 auto}
aside.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:20px 12px 40px 16px;border-right:3px solid var(--gold);background:linear-gradient(180deg,#4e1727 0%,#36101b 100%);color:#fff}
.side details{margin-bottom:6px;border-radius:12px}
.side summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;min-height:44px;border-radius:10px;font:700 18px "Barlow Condensed",sans-serif;color:#f1d9a0}
.side summary::-webkit-details-marker{display:none}
.side summary::after{content:"";width:9px;height:9px;border-right:2px solid #f1d9a0;border-bottom:2px solid #f1d9a0;transform:rotate(-45deg);transition:transform .2s}
.side details[open] summary::after{transform:rotate(45deg)}
.side summary:hover{background:rgba(255,255,255,.08)}
.side ul{list-style:none;margin:2px 0 8px;padding:0 0 0 8px;border-left:2px solid rgba(212,167,44,.35);margin-left:14px}
.side li button{width:100%;text-align:left;display:flex;align-items:center;gap:8px;justify-content:space-between;border:0;background:none;color:#fff;font:500 15.5px Barlow,sans-serif;padding:9px 10px;min-height:42px;border-radius:8px;cursor:pointer}
.side li button:hover{background:rgba(255,255,255,.1)}
.side li button[aria-current=page]{background:var(--gold);color:#1a0d00;font-weight:700}
.side li button .pos{font:600 12px Barlow,sans-serif;color:#e9c6cd}.side li button[aria-current=page] .pos{color:#5a3d00}
.side li button .you{font:700 11px Barlow,sans-serif;background:#111;color:var(--gold);border-radius:5px;padding:1px 6px}
.side .soon{font:600 11px Barlow,sans-serif;color:#e9c6cd;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:0 5px}
.side .close{display:none}
@media(max-width:900px){.layout{grid-template-columns:210px minmax(0,1fr)}aside.side{padding:16px 8px 40px 10px}.side summary{font-size:17px}.side li button{font-size:14.5px;padding:8px}}
@media(max-width:600px){
 .layout{grid-template-columns:minmax(0,1fr)}
 aside.side{position:static;height:auto;overflow:visible;border-right:0;border-bottom:3px solid var(--gold);padding:12px 12px 6px}
 .side ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 6px}
}
</style>
</head>

{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isGV=n=>/granavoley/i.test(n||'');
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const parseD=s=>{const m=/(\d{2})-(\d{2})-(\d{4})/.exec(s||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const today=new Date();today.setHours(0,0,0,0);
const T=DATA.teams;
let cur='semana', onlyMine=true, roundSel={};

document.getElementById('upd2').textContent=DATA.updated;

const mapsUrl=v=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v);
const venueOf=m=>m.venue||m.loc||'';
const venueHTML=m=>{const v=venueOf(m);return v?`<div class="venue lc"><span>${esc(v)}</span><a href="${esc(mapsUrl(v))}" target="_blank" rel="noopener">Cómo llegar</a></div>`:''};
const setsHTML=m=>m.sets&&m.sets.length?`<div class="sets">Sets: ${m.sets.map(esc).join(' · ')}</div>`:'';
function outcome(m){
  if(!m.res) return null; const r=/(\d+)\s*-\s*(\d+)/.exec(m.res); if(!r) return null;
  const a=+r[1],b=+r[2];
  if(isGV(m.home)) return a>b?'w':'l'; if(isGV(m.away)) return b>a?'w':'l'; return null;
}
const resFor=(m,team)=>{const r=/(\d+)\s*-\s*(\d+)/.exec(m.res||'');if(!r)return null;const a=+r[1],b=+r[2];return (m.home==team? a>b : b>a)?'w':'l'};
function myMatches(t){return t.rounds.flatMap(r=>r.matches.map(m=>({...m,round:r.n,team:t}))).filter(m=>isGV(m.home)||isGV(m.away))}
const byDate=(a,b)=>(parseD(a.date)||0)-(parseD(b.date)||0)||String(a.time).localeCompare(b.time);
const rival=m=>isGV(m.home)?m.away:m.home;

function card(m,showComp){
  const d=parseD(m.date); const o=outcome(m);
  const badge=o?`<span class="badge ${o}">${o=='w'?'Victoria':'Derrota'}</span>`:'';
  const sc=(m.res||'').split('-').map(x=>x.trim());
  return `<article class="m">${badge}
   <div class="when">${d?`<div class="d">${d.getDate()}</div><div class="mo">${MES[d.getMonth()]}</div>`:'<div class="mo">Por fijar</div>'}<div class="t">${esc(m.time||'')}</div></div>
   <div class="comp">${showComp?esc(m.team.short)+' · ':''}Jornada ${esc(m.round)}</div>
   <div class="vs"><span class="${isGV(m.home)?'gv':''}">${esc(m.home)}</span><b>${esc(sc[0]||'')}</b><span class="${isGV(m.away)?'gv':''}">${esc(m.away)}</span><b>${esc(sc[1]||'')}</b></div>
   ${setsHTML(m)}${venueHTML(m)}</article>`;
}

function weekend(){
  const all=T.flatMap(myMatches);
  const future=all.filter(m=>{const d=parseD(m.date);return d&&d>=today&&!m.res}).sort(byDate);
  let next=[]; if(future.length){const d0=parseD(future[0].date);const lim=new Date(d0);lim.setDate(lim.getDate()+3);next=future.filter(m=>parseD(m.date)<=lim)}
  const past=all.filter(m=>m.res).sort((a,b)=>byDate(b,a));
  let last=[]; if(past.length){const d0=parseD(past[0].date);const lim=new Date(d0);lim.setDate(lim.getDate()-3);last=past.filter(m=>parseD(m.date)>=lim).sort(byDate)}
  return {next,last,past};
}

function avisosHTML(){
  return AVISOS.filter(a=>parseD(a.hasta)>=today).map(a=>`<section class="band" style="padding-bottom:0"><div class="wrap"><div class="aviso">

  </div></div></section>`).join('');
}

function weekView(){

    ${next.length?`<div class="grid">${next.map(m=>card(m,true)).join('')}</div>`:'<div class="empty">No hay partidos programados próximamente.</div>'}

  </div></section>

      return `<button class="m" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-go="${esc(t.id)}">

function rivalPanel(t,nx){
  if(!nx) return '';
  const rv=rival(nx); const rows=t.standings?.rows||[];
  const sr=rows.find(r=>r[1]==rv);
  const played=t.rounds.flatMap(r=>r.matches.map(m=>({...m,round:r.n}))).filter(m=>(m.home==rv||m.away==rv)&&m.res).sort(byDate);
  const form=played.slice(-5).map(m=>{const o=resFor(m,rv);return `<i title="${esc(m.home+' '+m.res+' '+m.away)}" style="background:var(--${o=='w'?'win':'loss'})">${o=='w'?'G':'P'}</i>`}).join('');
  const ida=played.filter(m=>isGV(m.home)||isGV(m.away)).pop();
  const lastR=played.slice(-3).reverse().map(m=>`<div class="note">J${esc(m.round)}: ${esc(m.home)} <b>${esc(m.res)}</b> ${esc(m.away)}</div>`).join('');
  return `<div class="panel"><h3 class="cond">Próximo rival</h3>
   <div style="font:700 22px 'Barlow Condensed',sans-serif;margin-bottom:8px">${esc(rv)}</div>
   <dl class="rv">
    <dt>Partido</dt><dd>${nx.date?esc(DIA[parseD(nx.date).getDay()]+' '+nx.date.slice(0,5)+(nx.time?' · '+nx.time:'')):'Fecha por fijar'} · ${isGV(nx.home)?'en casa':'fuera'}</dd>
    ${sr?`<dt>Clasificación</dt><dd>${esc(sr[0])}º · ${esc(sr[2])} pts · ${esc(sr[4])}G ${esc(sr[5])}P · sets ${esc(sr[6])}-${esc(sr[7])}</dd>`:''}
    ${form?`<dt>Racha</dt><dd><div class="form">${form}</div></dd>`:''}
    <dt>Ida</dt><dd>${ida?esc(ida.home+' '+ida.res+' '+ida.away):'Todavía no os habéis enfrentado'}</dd>
   </dl>${lastR?`<div style="margin-top:10px">${lastR}</div>`:''}</div>`;
}

function teamText(t){
  const mm=myMatches(t).filter(m=>!m.res).sort(byDate);
  return 'GRANAVOLEY · '+t.name+'\n\n'+mm.map(m=>{const d=parseD(m.date);
    return `J${m.round} · ${d?DIA[d.getDay()]+' '+m.date.slice(0,5)+(m.time?' '+m.time:''):'fecha por fijar'}\n${m.home} – ${m.away}${venueOf(m)?'\n'+venueOf(m):''}`}).join('\n\n');
}

const wkKey=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x};

  return `<div class="li"><div class="tm">${esc(m.time||'--:--')}<small>${d?esc(DIA[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MES[d.getMonth()]):'por fijar'}</small></div>

   ${m.res?`<div class="rs ${o||''}">${esc(sc)}</div>`:'<div></div>'}${venueHTML(m)}</div>`}
function weekendsView(){
  const all=T.flatMap(myMatches).filter(m=>m.date);
  const map=new Map();all.forEach(m=>{const k=wkKey(parseD(m.date)).getTime();if(!map.has(k))map.set(k,[]);map.get(k).push(m)});
  const keys=[...map.keys()].sort((a,b)=>a-b);
  if(!keys.length) return `<section class="band"><div class="wrap"><h2>Fines de semana</h2><div class="empty">No hay partidos con fecha.</div></div></section>`;
  if(wkIdx===null){const t0=wkKey(today).getTime();wkIdx=keys.findIndex(k=>k>=t0);if(wkIdx<0)wkIdx=keys.length-1}
  wkIdx=Math.max(0,Math.min(keys.length-1,wkIdx));
  const k=keys[wkIdx],ms=map.get(k).sort(byDate);const mon=new Date(k);const sat=new Date(k);sat.setDate(sat.getDate()+5);const sun=new Date(k);sun.setDate(sun.getDate()+6);
  const days=new Map();ms.forEach(m=>{const dd=m.date;if(!days.has(dd))days.set(dd,[]);days.get(dd).push(m)});
  const undated=T.flatMap(myMatches).filter(m=>!m.date&&!m.res).length;
  return `<section class="band"><div class="wrap">
   <h2>Fines de semana</h2><p class="lead">Todos los partidos de Granavoley agrupados por fin de semana, para organizar pabellón, desplazamientos y público.</p>
   <div class="wk"><button class="btn" data-wk="-1" ${wkIdx==0?'disabled':''} aria-label="Fin de semana anterior">Anterior</button>
    <h3>${sat.getDate()}${sat.getMonth()!=sun.getMonth()?' '+MES[sat.getMonth()]:''} – ${sun.getDate()} ${MES[sun.getMonth()]} ${sun.getFullYear()}</h3>
    <button class="btn" data-wk="1" ${wkIdx==keys.length-1?'disabled':''} aria-label="Fin de semana siguiente">Siguiente</button>
    <span class="note">${ms.length} partido${ms.length==1?'':'s'}</span></div>
   ${[...days.entries()].map(([dd,list])=>`<div class="vgroup"><h3 class="cond">${esc(fmtD(parseD(dd)))}</h3><div class="list">${list.map(m=>liRow(m)).join('')}</div></div>`).join('')}
   ${undated?`<p class="note">Hay ${undated} partidos de jornadas futuras sin fecha fijada por la federación; aparecerán aquí cuando la tengan.</p>`:''}
  </div></section>`;

const homeVenue=m=>{const v=venueOf(m);return v||'Pabellón por confirmar'};

function streak(list){let best=0,cur=0;list.forEach(m=>{if(outcome(m)=='w'){cur++;best=Math.max(best,cur)}else cur=0});return best}
function statsView(){
  const rows=T.map(t=>{const p=myMatches(t).filter(m=>m.res).sort(byDate);const w=p.filter(m=>outcome(m)=='w').length;const st=t.standings?.rows.find(r=>isGV(r[1]));
    return {t,pj:p.length,w,l:p.length-w,pct:p.length?w/p.length:0,pos:st?+st[0]:null,n:t.standings?.rows.length||0,sf:st?+st[6]:0,sc:st?+st[7]:0,best:streak(p),
     cur:(()=>{let c=0;for(let i=p.length-1;i>=0&&outcome(p[i])==outcome(p[p.length-1]);i--)c++;return p.length?{k:outcome(p[p.length-1]),c}:null})()}});
  const W=rows.reduce((a,r)=>a+r.w,0),L=rows.reduce((a,r)=>a+r.l,0),SF=rows.reduce((a,r)=>a+r.sf,0),SC=rows.reduce((a,r)=>a+r.sc,0);
  const top=rows.filter(r=>r.pos&&r.pos<=2);const bestS=rows.slice().sort((a,b)=>b.best-a.best)[0];
  const sorted=rows.slice().sort((a,b)=>b.pct-a.pct||b.w-a.w);
  return `<section class="band"><div class="wrap">
   <h2>Estadísticas del club</h2><p class="lead">Balance de todos los equipos de Granavoley en la temporada 2026/27.</p>
   <div class="stats">
    <div class="stat"><b>${W}–${L}</b><span>victorias – derrotas</span></div>
    <div class="stat"><b>${W+L?Math.round(100*W/(W+L)):0}%</b><span>partidos ganados</span></div>
    <div class="stat"><b>${SF}–${SC}</b><span>sets a favor – en contra</span></div>
    <div class="stat"><b>${top.length}</b><span>equipos en los dos primeros puestos</span></div>
    ${bestS&&bestS.best?`<div class="stat"><b>${bestS.best}</b><span>mejor racha de victorias (${esc(bestS.t.short)})</span></div>`:''}
   </div>
   <h3 class="cond" style="font-size:24px;margin:0 0 8px">Porcentaje de victorias por equipo</h3>
   <div class="bars">${sorted.map(r=>`<div class="bar-row"><div class="nm">${esc(r.t.short)}<small>${r.pos?r.pos+'º de '+r.n:''}${r.cur&&r.cur.c>1?' · '+r.cur.c+(r.cur.k=='w'?' victorias':' derrotas')+' seguidas':''}</small></div>
     <div class="track" role="img" aria-label="${Math.round(r.pct*100)}% de victorias"><i style="width:${Math.max(2,Math.round(r.pct*100))}%"></i></div>
     <div class="vv"><b>${Math.round(r.pct*100)}%</b> · ${r.w}G ${r.l}P</div></div>`).join('')}</div>
   <p class="note" style="margin-top:8px">Sets según la clasificación oficial de cada liga. Rachas calculadas con los partidos jugados hasta la última actualización.</p>
  </div></section>`;
}

  const cats=[['Sénior masculino',t=>t.cat=='Sénior masculino'],['Sénior femenino',t=>t.cat=='Sénior femenino'],['Cantera',t=>!/^Sénior/.test(t.cat)]];
  for(const [name,f] of cats){const it=T.filter(f).map(t=>({id:t.id,label:t.short,pos:posOf(t)}));if(it.length)groups.push({t:name,items:it})}
  groups.push({t:'El club',items:[{id:'club',label:'Quiénes somos'},...(TIENDA.visible?[{id:'tienda',label:'Tienda'}]:[]),{id:'avisos',label:'Avisos'}]});
  for(const pg of PAGINAS){let g=groups.find(x=>x.t==pg.grupo);if(!g){g={t:pg.grupo,items:[]};groups.push(g)}g.items.push({id:pg.id,label:pg.titulo,soon:pg.pronto})}
  return groups;
}
let openState={};try{openState=JSON.parse(localStorage.getItem('gv-nav')||'{}')}catch(e){}
function renderNav(){
  const side=document.getElementById('side');
  side.innerHTML=navModel().map(g=>`<details ${openState[g.t]===false?'':'open'} data-g="${esc(g.t)}"><summary>${esc(g.t)}</summary><ul>${g.items.map(i=>`<li><button data-nav="${esc(i.id)}" ${i.id==cur?'aria-current="page"':''}><span>${esc(i.label)}</span>${i.you?`<span class="you">${esc(i.you)}</span>`:i.soon?'<span class="soon">Pronto</span>':i.pos?`<span class="pos">${esc(i.pos)}</span>`:''}</button></li>`).join('')}</ul></details>`).join('');
  side.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  side.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{openState[d.dataset.g]=d.open;try{localStorage.setItem('gv-nav',JSON.stringify(openState))}catch(e){}});
}
function render(){
  renderNav();
  const t=T.find(x=>x.id==cur); const pg=PAGINAS.find(x=>x.id==cur);
  document.getElementById('view').innerHTML=t?teamView(t):pg?pageView(pg):cur=='avisos'?avisosView():cur=='findes'?weekendsView():cur=='casa'?homeView():cur=='stats'?statsView():cur=='club'?clubView():cur=='tienda'&&TIENDA.visible?shopView():weekView();
  const rsel=document.getElementById('rsel'); if(rsel) rsel.onchange=e=>{roundSel[cur]=e.target.value;render()};
  document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{onlyMine=b.dataset.mine=='1';render()});
  document.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{wkIdx+=+b.dataset.wk;render()});
  document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{shopSel[b.dataset.p].talla=b.dataset.size;render()});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const s=shopSel[b.dataset.p];s.n=Math.max(1,Math.min(20,s.n+(+b.dataset.q)));render()});
  document.querySelectorAll('[data-nm]').forEach(i=>i.onchange=()=>{shopSel[i.dataset.nm].nombre=i.value.slice(0,60);render()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(teamText(t),document.getElementById('cpok')));
}
function go(id){cur=id;try{location.hash=id=='semana'?'':id}catch(e){}render();window.scrollTo({top:0,behavior:'smooth'})}
const valid=h=>['avisos','findes','casa','stats','club',...(TIENDA.visible?['tienda']:[])].includes(h)||T.some(t=>t.id==h)||PAGINAS.some(p=>p.id==h);
const h0=location.hash.slice(1); if(valid(h0)) cur=h0;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);cur=valid(h)?h:'semana';render()});
render();
}
</script>
